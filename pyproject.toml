[project]
name = "class2md"
version = "0.1.0"
description = "Conjunto de ferramentas que reduz o atrito entre a aula e a revisão: transforma fotos de lousa e caderno, e PDFs de livro, em notas de Obsidian e flashcards de Anki, usando a API da Anthropic (Claude)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.0.0",
    "pypdfium2>=5.13.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=4.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008: Typer declara argumentos e opções como valores padrão (`typer.Option(...)`).
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "projetos", "ui", "scripts", "tests"]
