<svg xmlns="http://www.w3.org/2000/svg" lang="pt-BR">
<title>Ícones da interface local do class2md</title>
<desc>Arquivo de símbolos. Cada ícone é usado ao lado de um texto e fica oculto para leitor de tela. A cor vem do texto em volta.</desc>

<!-- Motivo próprio: uma foto que passa para uma folha de nota. Grade de 32. -->
<symbol id="marca" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M14 17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/>
  <path d="M5 14l3.5-3.5 3 3"/>
  <circle cx="12.5" cy="8" r="1.25"/>
  <path d="M16 12h8l5 5v11a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2z"/>
  <path d="M24 12v5h5"/>
  <path d="M18 21h7M18 25h7"/>
</symbol>

<!-- Materiais: o id é "m-" mais o valor do material. Grade de 24. -->
<symbol id="m-foto_aula" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="5" width="18" height="14" rx="2"/>
  <circle cx="8.5" cy="9.5" r="1.5"/>
  <path d="M3.5 17l5-4.5 3.5 3.5"/>
  <path d="M12 16l3.5-3.5 5.5 5.5"/>
</symbol>
<symbol id="m-pdf_livro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 19V5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0 0 4h12"/>
  <path d="M9 7.5h6"/>
</symbol>
<symbol id="m-pdf_capitulos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <rect x="8" y="3" width="12" height="15" rx="2"/>
  <path d="M4 8v11a2 2 0 0 0 2 2h9"/>
  <path d="M11.5 8h5M11.5 12h5"/>
</symbol>
<symbol id="m-pdf_lista" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="3" width="16" height="18" rx="2"/>
  <path d="M7.5 8.5l1 1 2-2M13.5 8.5H17"/>
  <path d="M7.5 15l1 1 2-2M13.5 15H17"/>
</symbol>

<!-- Estados da lista de progresso: o id é "e-" mais o estado. -->
<symbol id="e-espera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
